<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Institucional VCXC</title>
    <style>
        body { 
            font-family: 'Times New Roman', Times, serif, Arial; 
            padding: 15px; 
            background-image: url('https://postimg.cc'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1a1a; 
            text-align: center; 
            color: #333; 
        }
        .card { max-width: 480px; margin: 20px auto; background: rgba(255, 255, 255, 0.96); padding: 30px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border-top: 8px solid #66001c; }
        .banner-img { width: 100%; max-height: 140px; object-fit: contain; margin-bottom: 15px; }
        h2 { color: #66001c; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 24px; }
        .subtitle { color: #8a6d3b; font-size: 14px; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        h3 { color: #66001c; border-bottom: 1px solid #8a6d3b; padding-bottom: 5px; margin-top: 35px; text-align: left; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #1a1a1a; font-size: 14px; }
        input[type="text"], input[type="tel"], select, textarea { width: 100%; padding: 12px; font-size: 15px; border-radius: 2px; border: 1px solid #b3b3b3; box-sizing: border-box; font-family: Arial, sans-serif; background-color: #fcfcfc; }
        input[type="text"]:focus, input[type="tel"]:focus, select:focus, textarea:focus { border-color: #66001c; outline: none; background-color: #fff; }
        
        .geo-grid { display: flex; gap: 10px; margin-top: 10px; }
        .geo-box { flex: 1; background: #f9f9f9; border: 1px solid #b3b3b3; padding: 10px; border-radius: 2px; font-size: 14px; font-weight: bold; text-align: center; }
        .geo-label { font-size: 11px; text-transform: uppercase; color: #666; display: block; margin-bottom: 4px; }
        
        .radio-tile-group { display: flex; gap: 10px; margin-top: 5px; }
        .radio-tile-group.vertical { flex-direction: column; gap: 8px; }
        .radio-tile { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #b3b3b3; padding: 12px; border-radius: 2px; cursor: pointer; text-align: center; background: #f9f9f9; font-weight: bold; font-size: 14px; transition: all 0.2s ease; }
        .radio-tile input { position: absolute; opacity: 0; }
        .radio-tile:has(input:checked) { border-color: #66001c; background-color: #66001c; color: #dfb15b; box-shadow: inset 0 0 0 1px #8a6d3b; }
        
        button { width: 100%; padding: 15px; font-size: 15px; font-weight: bold; border: 1px solid transparent; border-radius: 2px; cursor: pointer; margin-bottom: 15px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease; }
        
        /* Todos los botones unificados en Guinda Institucional */
        .btn-guinda { background-color: #66001c; color: #ffffff; border-color: #66001c; }
        .btn-guinda:hover { background-color: #4a0014; }
        
        .status-box { background: #fdfaf2; color: #1a1a1a; padding: 14px; font-weight: bold; font-size: 15px; border-radius: 2px; margin-bottom: 20px; border: 1px solid #8a6d3b; border-left: 6px solid #8a6d3b; text-align: left; }
        .error-alert { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 12px; border-radius: 2px; text-align: left; font-size: 14px; margin-top: 15px; display: none; line-height: 1.5; }
    </style>
</head>

<script>
    // IMPORTANTE: REEMPLAZA ESTA URL POR LA QUE TE DA GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyiY_yOevXLEq-phzMgrSsY7_EeQitZUGnrifZEtrR_txlHfqELGQVX0F7fFKf8mg0c/exec";

    let latitudActual = "";
    let longitudActual = "";

    function buscarGPS() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            status.innerText = "El dispositivo no soporta localización GPS.";
            return;
        }
        status.innerText = "Conectando con hardware GPS...";
        
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                latitudActual = pos.coords.latitude;
                longitudActual = pos.coords.longitude;
                document.getElementById('lat-txt').innerText = latitudActual;
                document.getElementById('lon-txt').innerText = longitudActual;
                status.innerText = "Coordenadas fijadas con éxito.";
                document.getElementById('error-box').style.display = "none";
            },
            (err) => { status.innerText = "Error: Active la ubicación de su equipo móvil."; },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function guardarFormularioValidado() {
        const status = document.getElementById('status');
        const errorBox = document.getElementById('error-box');
        
        const servidor = document.getElementById('servidor').value.trim();
        const nombre = document.getElementById('nombre').value.trim();
        const appat = document.getElementById('apellido_paterno').value.trim();
        const localidad = document.getElementById('localidad').value.trim();
        const zona = document.getElementById('zona').value.trim();
        const seccion = document.getElementById('seccion').value.trim();
        const recepcion = document.getElementById('recepcion').value;
        
        const radioSexo = document.querySelector('input[name="sexo"]:checked');
        const radioEdad = document.querySelector('input[name="grupo_edad"]:checked');

        let errores = [];

        if (!latitudActual || !longitudActual) errores.push("• 1. Geolocalización (Falta pulsar botón GPS)");
        if (!servidor) errores.push("• 2. Servidor Público");
        if (!nombre) errores.push("• 3. Nombre(s)");
        if (!appat) errores.push("• 4. Apellido paterno");
        if (!radioSexo) errores.push("• 7. Sexo");
        if (!radioEdad) errores.push("• 8. Grupo de edad");
        if (!localidad) errores.push("• 10. Localidad");
        if (!zona) errores.push("• 11. Zona");
        if (!seccion) errores.push("• 12. Sección");
        if (!recepcion) errores.push("• 14. Recepción del mensaje");

        if (errores.length > 0) {
            status.innerText = "";
            boxText = "<strong>Falta llenar o corregir los siguientes campos obligatorios:</strong><br>";
            errorBox.innerHTML = boxText + errores.join("<br>");
            errorBox.style.display = "block";
            errorBox.scrollIntoView({ behavior: 'smooth' });
            return;
        }

        errorBox.style.display = "none";
        const ahora = new Date();
        const nuevoRegistro = {
            fecha: ahora.toLocaleDateString('es-MX'),
            hora: ahora.toLocaleTimeString('es-MX'),
            lat: latitudActual,
            lon: longitudActual,
            servidor: servidor,
            nombre: nombre,
            appat: appat,
            apmat: document.getElementById('apellido_materno').value.trim(),
            tel: document.getElementById('telefono').value.trim(),
            sexo: radioSexo.value,
            edad: radioEdad.value,
            domicilio: document.getElementById('domicilio').value.trim(),
            localidad: localidad,
            zona: zona,
            seccion: seccion,
            programa: document.getElementById('programa').value,
            recepcion: recepcion,
            problematica: document.getElementById('problematica').value,
            observacion: document.getElementById('observacion').value.trim()
        };

        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        datosLocales.push(nuevoRegistro);
        localStorage.setItem('visitas_vcxc', JSON.stringify(datosLocales));

        latitudActual = ""; longitudActual = "";
        document.getElementById('lat-txt').innerText = "-";
        document.getElementById('lon-txt').innerText = "-";
        document.getElementById('servidor').value = "";
        document.getElementById('nombre').value = "";
        document.getElementById('apellido_paterno').value = "";
        document.getElementById('apellido_materno').value = "";
        document.getElementById('telefono').value = "";
        document.getElementById('domicilio').value = "";
        document.getElementById('localidad').value = "";
        document.getElementById('zona').value = "";
        document.getElementById('seccion').value = "";
        document.getElementById('programa').value = "";
        document.getElementById('recepcion').value = "";
        document.getElementById('problematica').value = "";
        document.getElementById('observacion').value = "";
        if(radioSexo) radioSexo.checked = false;
        if(radioEdad) radioEdad.checked = false;
        
        status.innerText = "Registro verificado y guardado localmente.";
        actualizarContador();
    }

    function actualizarContador() {
        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        document.getElementById('contador').innerText = "📂 Registros sin localizar en base central: " + datosLocales.length;
    }

    async function sincronizarGSheets() {
        const status = document.getElementById('status');
        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];

        if (datosLocales.length === 0) {
            status.innerText = "No se localizan registros listos para envío.";
            return;
        }
        if (!navigator.onLine) {
            status.innerText = "Sincronización suspendida: Dispositivo sin acceso a internet.";
            return;
        }

        status.innerText = "Estableciendo conexión y transmitiendo registros masivos...";

        const formData = new URLSearchParams();
        formData.append('datos', JSON.stringify(datosLocales));

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            });

            localStorage.removeItem('visitas_vcxc');
            status.innerText = "¡Sincronización institucional exitosa en Google Sheets!";
            actualizarContador();
        } catch (error) {
            status.innerText = "Fallo en la comunicación con el servidor central de Google.";
        }
    }

    actualizarContador();
</script>

</body>
</html>
