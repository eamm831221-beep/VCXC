        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f7f6; text-align: center; }
        .card { max-width: 480px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.12); }
        h2, h3 { color: #0f342e; margin-bottom: 20px; }
        h3 { border-bottom: 2px solid #b2dfdb; padding-bottom: 5px; margin-top: 30px; text-align: left; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #263238; }
        input[type="text"], input[type="tel"], input[type="list"], select { width: 100%; padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #cfd8dc; box-sizing: border-box; }
        
        .radio-tile-group { display: flex; gap: 10px; margin-top: 5px; }
        .radio-tile-group.vertical { flex-direction: column; gap: 8px; }
        .radio-tile { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; border: 2px solid #cfd8dc; padding: 14px; border-radius: 6px; cursor: pointer; text-align: center; background: #fafafa; font-weight: bold; }
        .radio-tile input { position: absolute; opacity: 0; }
        .radio-tile:has(input:checked) { border-color: #00796b; background-color: #e0f2f1; color: #004d40; }
        
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 15px; box-sizing: border-box; }
        .btn-geo { background-color: #0288d1; color: white; }
        .btn-save { background-color: #00796b; color: white; }
        .btn-sync { background-color: #f57c00; color: white; }
        .info { background: #e9ecef; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; }
        hr { border: 0; height: 1px; background: #ccc; margin: 25px 0; }
    </style>
</head>

    <div id="contador" style="font-weight: bold; margin-bottom: 10px;">Registros pendientes: 0</div>
    <button type="button" class="btn-sync" onclick="sincronizarGSheets()">🔄 Sincronizar a Google Sheets</button>
    <div id="status" style="margin-top: 15px; font-weight: bold; color: #333;"></div>

<script>
    // IMPORTANTE: REEMPLAZA ESTA URL POR LA QUE TE DA GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2cAqiwSSXyYSvPErF0zaKJJsfi2YbYVN95UMIKLhEUON9Z6Jo58Uy8CEh0j2WjxFB/exec";

    let latitudActual = "";
    let longitudActual = "";

    function buscarGPS() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            status.innerText = "Tu celular no soporta GPS nativo.";
            return;
        }
        status.innerText = "Buscando satélites...";
        
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                latitudActual = pos.coords.latitude;
                longitudActual = pos.coords.longitude;
                document.getElementById('lat-txt').innerText = latitudActual;
                document.getElementById('lon-txt').innerText = longitudActual;
                status.innerText = "¡Georreferencia encontrada!";
            },
            (err) => { status.innerText = "Error: Activa el GPS de tu celular."; },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function guardarOffline() {
        const status = document.getElementById('status');
        const servidor = document.getElementById('servidor').value;
        const nombre = document.getElementById('nombre').value;
        const appat = document.getElementById('apellido_paterno').value;
        const apmat = document.getElementById('apellido_materno').value;
        const tel = document.getElementById('telefono').value;
        
        const radioSexo = document.querySelector('input[name="sexo"]:checked');
        const radioEdad = document.querySelector('input[name="grupo_edad"]:checked');
        
        const sexo = radioSexo ? radioSexo.value : "";
        const edad = radioEdad ? radioEdad.value : "";

        if (!latitudActual || !longitudActual) {
            status.innerText = "Primero debes buscar la georreferencia.";
            return;
        }
        if (!servidor) {
            status.innerText = "Por favor, ingresa o selecciona un Servidor Público.";
            return;
        }

        const ahora = new Date();
        const nuevoRegistro = {
            fecha: ahora.toLocaleDateString('es-MX'),
            hora: ahora.toLocaleTimeString('es-MX'),
            lat: latitudActual,
            lon: longitudActual,
            servidor: servidor,
            nombre: nombre,
            appat: appat,
            apmat: apmat,
            tel: tel,
            sexo: sexo,
            edad: edad
        };

        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        datosLocales.push(nuevoRegistro);
        localStorage.setItem('visitas_vcxc', JSON.stringify(datosLocales));

        latitudActual = ""; longitudActual = "";
        document.getElementById('lat-txt').innerText = "-";
        document.getElementById('lon-txt').innerText = "-";
        document.getElementById('servidor').value = "";
        document.getElementById('nombre').value = "";
        document.getElementById('apellido_paterno').value = "";
        document.getElementById('apellido_materno').value = "";
        document.getElementById('telefono').value = "";
        if(radioSexo) radioSexo.checked = false;
        if(radioEdad) radioEdad.checked = false;
        
        status.innerText = "¡Registro guardado localmente!";
        actualizarContador();
    }

    function actualizarContador() {
        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        document.getElementById('contador').innerText = "Registros pendientes: " + datosLocales.length;
    }

    async function sincronizarGSheets() {
        const status = document.getElementById('status');
        let datosLocales = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];

        if (datosLocales.length === 0) {
            status.innerText = "No hay registros pendientes por enviar.";
            return;
        }
        if (!navigator.onLine) {
            status.innerText = "Sin internet. No puedes sincronizar todavía.";
            return;
        }

        status.innerText = "Sincronizando registros...";

        const formData = new URLSearchParams();
        formData.append('datos', JSON.stringify(datosLocales));

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            });

            localStorage.removeItem('visitas_vcxc');
            status.innerText = "¡Sincronización exitosa! Datos guardados en la hoja VCXC.";
            actualizarContador();
        } catch (error) {
            status.innerText = "Error al conectar con Google Sheets.";
        }
    }

    actualizarContador();
</script>
